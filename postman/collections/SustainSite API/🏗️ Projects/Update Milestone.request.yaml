$kind: http-request
url: "{{baseUrl}}/api/projects/{{projectId}}/milestones/{{milestoneId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "Completed",
      "completionPercentage": 100
    }
order: 7000
