$kind: http-request
description: "Access: Project manager or ADMIN only."
url: "{{baseUrl}}/api/projects/{{projectId}}/milestones"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Foundation Complete",
      "description": "All foundation works completed",
      "targetDate": "2026-04-30"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.data && res.data.milestones) {
        const milestones = res.data.milestones;
        const last = milestones[milestones.length - 1];
        if (last && last._id) {
          pm.collectionVariables.set('milestoneId', last._id);
          console.log('milestoneId saved:', last._id);
        }
      }
    language: text/javascript
order: 6000
