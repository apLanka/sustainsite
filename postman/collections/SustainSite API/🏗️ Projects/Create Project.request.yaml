$kind: http-request
description: |-
  Access: ADMIN, PROJECT_MANAGER

  `projectId` is auto-saved to `{{projectId}}`.
url: "{{baseUrl}}/api/projects"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "projectName": "Green Tower Construction",
      "description": "Sustainable high-rise residential building",
      "location": {
        "address": "123 Main St, Colombo, Sri Lanka",
        "latitude": 6.9271,
        "longitude": 79.8612
      },
      "startDate": "2026-03-01",
      "endDate": "2026-12-31",
      "budget": 50000000
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.data && res.data._id) {
        pm.collectionVariables.set('projectId', res.data._id);
        console.log('projectId saved:', res.data._id);
      }
    language: text/javascript
order: 1000
