$kind: http-request
description: "Access: ADMIN, PROJECT_MANAGER, INSPECTOR"
url: "{{baseUrl}}/api/sustainability"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "projectId": "{{projectId}}",
      "carbonEmissions": {
        "transportation": 1.5,
        "equipment": 2.3,
        "materials": 1.2
      },
      "energyConsumption": {
        "electricity": 2500,
        "diesel": 150,
        "renewableEnergy": 500
      },
      "wasteManagement": {
        "recyclable": 800,
        "nonRecyclable": 200,
        "hazardous": 50
      },
      "waterUsage": {
        "municipal": 12000,
        "recycled": 3000
      },
      "recordedDate": "2026-02-24",
      "notes": "Weekly sustainability audit"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.data && res.data._id) {
        pm.collectionVariables.set('metricId', res.data._id);
        console.log('metricId saved:', res.data._id);
      }
    language: text/javascript
order: 1000
