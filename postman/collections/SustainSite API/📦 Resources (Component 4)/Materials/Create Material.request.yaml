$kind: http-request
url: "{{baseUrl}}/api/resources/materials"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "projectId": "{{projectId}}",
      "materialName": "Portland Cement",
      "category": "Cement",
      "quantity": 100,
      "unit": "tons",
      "unitPrice": 15000,
      "supplier": "{{supplierId}}",
      "expectedDeliveryDate": "2026-03-05",
      "minimumThreshold": 30,
      "sustainabilityRating": 7
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.data && res.data._id) {
        pm.collectionVariables.set('materialId', res.data._id);
        console.log('materialId saved:', res.data._id);
      }
    language: text/javascript
order: 1000
