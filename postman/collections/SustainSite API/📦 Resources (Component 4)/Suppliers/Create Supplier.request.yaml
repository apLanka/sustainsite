$kind: http-request
url: "{{baseUrl}}/api/resources/suppliers"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "companyName": "Lanka Cement Co.",
      "contactPerson": "Nimal Perera",
      "email": "nimal@lankacement.com",
      "phoneNumber": "+94112345678",
      "address": {
        "street": "45 Industrial Zone",
        "city": "Gampaha",
        "country": "Sri Lanka"
      },
      "materialsSupplied": ["Cement", "Aggregates"],
      "paymentTerms": "Net 30",
      "sustainabilityScore": 8
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.data && res.data._id) {
        pm.collectionVariables.set('supplierId', res.data._id);
        console.log('supplierId saved:', res.data._id);
      }
    language: text/javascript
order: 1000
